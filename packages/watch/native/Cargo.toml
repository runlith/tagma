[package]
name = "watch-engine"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[lib]
name = "watch_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_System_Pipes"] }
