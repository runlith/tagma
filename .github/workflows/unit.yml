name: unit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: unit tests of every package
        run: |
          export TESTBED_BUDGET="$(getconf _NPROCESSORS_ONLN)"
          bun run test:all --script test --report "$RUNNER_TEMP/unit/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-report
          path: |
            ${{ runner.temp }}/unit
            /tmp/runlith-test/reports
          if-no-files-found: ignore
