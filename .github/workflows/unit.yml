name: unit

on:
  push:
    branches: [main]
    paths-ignore: ['.tagma/**']
  workflow_dispatch:

concurrency:
  group: unit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/tests.yml
    with:
      name: unit
      script: test
      runner: ubuntu-latest
      shards: 4
