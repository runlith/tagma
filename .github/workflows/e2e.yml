name: e2e
run-name: e2e ${{ inputs.package || 'all packages' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone; empty runs every package
        required: false
        default: ''
      test-pattern:
        description: Test name regex; empty runs every test
        required: false
        default: ''
      platform:
        description: Platform to check
        type: choice
        options:
          - all
          - linux
          - ios
        default: all

permissions:
  contents: read

jobs:
  linux:
    if: inputs.platform != 'ios'
    uses: ./.github/workflows/tests.yml
    with:
      name: e2e-linux
      script: test:e2e
      runner: ubuntu-latest
      shards: ${{ inputs.test-pattern != '' && 1 || 4 }}
      package: ${{ inputs.package }}
      test-pattern: ${{ inputs.test-pattern }}
      lanes: chromium,webkit,electron

  ios:
    if: inputs.platform != 'linux'
    uses: ./.github/workflows/tests.yml
    with:
      name: e2e-ios
      script: test:e2e:ios
      runner: macos-latest
      shards: 1
      package: ${{ inputs.package }}
      test-pattern: ${{ inputs.test-pattern }}
      lanes: ios
