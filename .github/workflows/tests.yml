name: tests

on:
  workflow_call:
    inputs:
      name:
        description: The lane, naming its artifacts and its timings cache
        required: true
        type: string
      script:
        description: The package script every suite runs
        required: true
        type: string
      runner:
        required: true
        type: string
      shards:
        description: Machines the lane's files are spread over by their recorded durations
        required: true
        type: number
      package:
        description: Workspace directory to run alone; empty runs every package
        required: false
        default: ''
        type: string
      test-pattern:
        description: Test name regex; empty runs every test
        required: false
        default: ''
        type: string
      lanes:
        description: Real engines needed by an e2e lane; empty needs no e2e setup
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - if: inputs.test-pattern == ''
        uses: actions/cache/restore@v6
        with:
          path: timings
          key: timings-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: timings-${{ inputs.name }}-
      - id: shards
        run: |
          mkdir -p timings
          touch timings/.timings
          echo "shards=$(jq -cn --argjson count ${{ inputs.shards }} '[range(1; $count + 1)]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: timings-${{ inputs.name }}-baseline
          path: timings
          include-hidden-files: true

  run:
    needs: plan
    name: ${{ inputs.name }} ${{ matrix.shard }}/${{ inputs.shards }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - if: inputs.script == 'test:integration' || inputs.script == 'test:native' || inputs.script == 'test:e2e'
        uses: actions/cache@v6
        with:
          path: packages/execution-host/native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/execution-host/native/Cargo.lock', 'packages/execution-host/native/**/Cargo.toml', 'packages/execution-host/native/**/*.rs') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - if: runner.os == 'macOS' && (inputs.script == 'test:integration' || inputs.script == 'test:e2e')
        id: whisper
        uses: actions/cache/restore@v6
        with:
          path: packages/speech-whisper/native/.build/whisper.artifact
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/speech-whisper/native/**', 'packages/speech-whisper/scripts/**', 'packages/speech-whisper/src/artifact.ts') }}
          restore-keys: whisper-${{ runner.os }}-${{ runner.arch }}-
      - if: (inputs.script == 'test:integration' || contains(inputs.lanes, 'chromium')) && !(runner.os == 'Linux' && runner.arch == 'ARM64')
        uses: actions/cache@v6
        with:
          path: ~/.cache/runlith/browser-builds
          key: browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/chrome-for-testing/src/build.ts') }}
      - if: (inputs.script == 'test:integration' || contains(inputs.lanes, 'chromium')) && !(runner.os == 'Linux' && runner.arch == 'ARM64')
        name: Chrome for Testing for the engine tests
        run: bun apps/tagma/server/scripts/fetch-browser.ts
      - if: contains(inputs.lanes, 'webkit')
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - if: contains(inputs.lanes, 'webkit')
        name: WebKit and its system libraries
        run: bun x --no-install playwright-core install --with-deps webkit
        working-directory: packages/e2e
      - if: contains(inputs.lanes, 'electron')
        name: Electron
        run: bun -e "require('electron/install.js')"
        working-directory: packages/e2e
      - if: contains(inputs.lanes, 'electron') && runner.os == 'Linux'
        name: Chromium sandbox helper
        working-directory: packages/e2e
        run: |
          sandbox="$(bun -e 'const path = require("node:path"); console.log(path.join(path.dirname(require("electron")), "chrome-sandbox"))')"
          sudo install -o root -g root -m 4755 "$sandbox" "$RUNNER_TEMP/chrome-devel-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          printf 'CHROME_DEVEL_SANDBOX=%s\n' "$RUNNER_TEMP/chrome-devel-sandbox" >> "$GITHUB_ENV"
      - if: contains(inputs.lanes, 'electron') && runner.os == 'Linux'
        name: Virtual display for Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: contains(inputs.lanes, 'ios')
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: contains(inputs.lanes, 'ios')
        name: iOS tools and Safari template
        env:
          E2E_IOS_RUNTIMES: '26'
        run: bun packages/e2e/scripts/fetch-ios.ts
      - if: contains(inputs.lanes, 'ios')
        name: iOS lane device
        env:
          E2E_IOS_RUNTIMES: '26'
        run: bun packages/e2e/scripts/prewarm-ios.ts
      - uses: actions/download-artifact@v8
        with:
          name: timings-${{ inputs.name }}-baseline
          path: .
      - name: tests
        env:
          PACKAGE: ${{ inputs.package }}
          LANES: ${{ inputs.lanes }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
          E2E_IOS_RUNTIMES: '26'
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          if [ "$RUNNER_OS" = macOS ]; then
            while :; do
              echo "$(date -u +%T) $(top -l 2 -s 1 -n 0 | grep 'CPU usage' | tail -1) | load $(sysctl -n vm.loadavg) | $(ps -axo %cpu=,comm= | sort -nr | head -5 | awk '{printf "%s%% %s, ", $1, $2}') | $(memory_pressure -Q | tail -1) | $(sysctl -n vm.swapusage) | $(vm_stat | awk '/Pageouts|Swapouts|Pages free|compressor/ {printf "%s %s ", $1, $NF}') | $(ps -axo rss=,comm= | sort -nr | head -5 | awk '{printf "%dM %s, ", $1/1024, $2}')"
              sleep 30
            done > "$RUNNER_TEMP/report/machine.log" &
          fi
          if [ -n "$LANES" ]; then export E2E_LANES="$LANES"; fi
          display=()
          if [ "$RUNNER_OS" = Linux ] && [[ ",$LANES," = *,electron,* ]]; then
            display=(xvfb-run -a)
          fi
          "${display[@]}" bun run test:all --stream --script '${{ inputs.script }}' --shard ${{ matrix.shard }}/${{ inputs.shards }} ${PACKAGE:+--package "$PACKAGE"} ${TEST_PATTERN:+--test-name-pattern "$TEST_PATTERN"} --report "$RUNNER_TEMP/report/report.json"
      - if: ${{ !cancelled() && steps.whisper.outcome == 'success' && steps.whisper.outputs.cache-hit != 'true' && hashFiles('packages/speech-whisper/native/.build/whisper.artifact') != '' }}
        uses: actions/cache/save@v6
        with:
          path: packages/speech-whisper/native/.build/whisper.artifact
          key: ${{ steps.whisper.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && inputs.test-pattern == '' }}
        name: this shard's timings
        run: bun scripts/change/timings.ts collect "$RUNNER_TEMP/timings"
      - if: ${{ !cancelled() && inputs.test-pattern == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ inputs.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          include-hidden-files: true
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-report-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/report
            /tmp/runlith-test/reports
          if-no-files-found: ignore

  timings:
    needs: run
    if: ${{ !cancelled() && inputs.test-pattern == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: timings-${{ inputs.name }}-*
          path: incoming
      - name: merge the shards' timings over the baseline
        run: mkdir -p timings && bun scripts/change/timings.ts merge timings "incoming/timings-${{ inputs.name }}-baseline" incoming/timings-${{ inputs.name }}-[0-9]*
      - uses: actions/cache/save@v6
        with:
          path: timings
          key: timings-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
