name: test

on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run tagma:typecheck

  unit:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> packages/execution-host/native/target'
      - run: bun run --workspaces --sequential --no-exit-on-error --if-present test

  integration:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: server 1/3
            run: bun run --cwd apps/tagma/server test:integration --shard=1/3
          - part: server 2/3
            run: bun run --cwd apps/tagma/server test:integration --shard=2/3
          - part: server 3/3
            run: bun run --cwd apps/tagma/server test:integration --shard=3/3
          - part: packages
            run: |
              status=0
              bun run --cwd packages/audio-darwin build || status=1
              bun run --filter '*' --filter '!@tagma/server' --sequential --no-exit-on-error --if-present test:integration || status=1
              bun run test:integration || status=1
              exit $status
    name: integration (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - name: Chrome for Testing for the managed browser itests
        if: startsWith(matrix.part, 'server')
        run: bun apps/tagma/server/scripts/fetch-browser.ts
      - name: pinned Ruff and Semgrep for the inspection runners
        if: matrix.part == 'packages'
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet ruff==0.13.3 semgrep==1.140.0 mcp==1.16.0 pydantic==2.11.10 pydantic-settings==2.11.0
          for tool in ruff semgrep; do
            binary="$RUNNER_TEMP/py/bin/$tool"
            name=$(echo "$tool" | tr a-z A-Z)
            echo "TAGMA_${name}_BINARY=$binary" >> "$GITHUB_ENV"
            echo "TAGMA_${name}_SHA256=$(shasum -a 256 "$binary" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          done
      - run: ${{ matrix.run }}
