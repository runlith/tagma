name: integration
run-name: integration ${{ inputs.package || 'all packages' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone, `.` for the root; empty runs every package
        required: false
        default: ''

permissions:
  contents: read

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: packages/execution-host/native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/execution-host/native/Cargo.lock', 'packages/execution-host/native/**/Cargo.toml', 'packages/execution-host/native/**/*.rs') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/runlith/browser-builds
          key: browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/chrome-for-testing/src/build.ts') }}
      - name: Chrome for Testing for the engine tests
        run: bun apps/tagma/server/scripts/fetch-browser.ts
      - name: integration tests
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          export TESTBED_BUDGET="$(getconf _NPROCESSORS_ONLN)"
          bun run test:all --script test:integration ${PACKAGE:+--package "$PACKAGE"} --report "$RUNNER_TEMP/integration/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-report
          path: |
            ${{ runner.temp }}/integration
            /tmp/runlith-test/reports
          if-no-files-found: ignore
