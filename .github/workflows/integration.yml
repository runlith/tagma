name: integration

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone, `.` for the root; empty runs every package
        required: false
        default: ''

permissions:
  contents: read

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: integration tests
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          export TESTBED_BUDGET="$(getconf _NPROCESSORS_ONLN)"
          bun run test:all --script test:integration ${PACKAGE:+--package "$PACKAGE"} --report "$RUNNER_TEMP/integration/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-report
          path: |
            ${{ runner.temp }}/integration
            /tmp/runlith-test/reports
          if-no-files-found: ignore
