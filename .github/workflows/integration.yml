name: integration
run-name: ${{ inputs.script || 'test:integration' }} ${{ inputs.package || 'all packages' }} on ${{ inputs.runner || 'macos-latest' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone, `.` for the root; empty runs every package
        required: false
        default: ''
      runner:
        description: The machine every shard runs on
        required: false
        default: macos-latest
      script:
        description: The package script every suite runs
        required: false
        default: test:integration
        type: choice
        options:
          - test:integration
          - test:native

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/tests.yml
    with:
      name: ${{ inputs.script == 'test:native' && 'native' || 'integration' }}-${{ inputs.runner || 'macos-latest' }}
      script: ${{ inputs.script || 'test:integration' }}
      runner: ${{ inputs.runner || 'macos-latest' }}
      shards: ${{ inputs.script == 'test:native' && 1 || 5 }}
      package: ${{ inputs.package }}
