name: integration
run-name: ${{ inputs.script || 'test:integration' }} ${{ inputs.package || 'all packages' }} on ${{ inputs.runner || 'ubuntu-latest' }}

on:
  push:
    branches: [main]
    paths-ignore: ['.tagma/**']
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone, `.` for the root; empty runs every package
        required: false
        default: ''
      runner:
        description: The machine every shard runs on; a macOS runner runs only the files marked for darwin
        required: false
        default: ubuntu-latest
      script:
        description: The package script every suite runs
        required: false
        default: test:integration
        type: choice
        options:
          - test:integration
          - test:native

concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-latest' }}-${{ inputs.script || 'test:integration' }}-${{ inputs.package }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/tests.yml
    with:
      name: ${{ inputs.script == 'test:native' && 'native' || 'integration' }}-${{ inputs.runner || 'ubuntu-latest' }}
      script: ${{ inputs.script || 'test:integration' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      shards: ${{ (inputs.script == 'test:native' && 1) || (startsWith(inputs.runner, 'macos') && 2) || 5 }}
      package: ${{ inputs.package }}
