name: integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: integration tests of every package
        run: bun run test:all --script test:integration --report "$RUNNER_TEMP/integration/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-report
          path: |
            ${{ runner.temp }}/integration
            /tmp/runlith-test/reports
          if-no-files-found: ignore
