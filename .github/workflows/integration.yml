name: integration
run-name: integration ${{ inputs.package || 'all packages' }} on ${{ inputs.runner || 'macos-latest' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace directory to run alone, `.` for the root; empty runs every package
        required: false
        default: ''
      runner:
        description: The machine every shard runs on
        required: false
        default: macos-latest

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/tests.yml
    with:
      name: integration-${{ inputs.runner || 'macos-latest' }}
      script: test:integration
      runner: ${{ inputs.runner || 'macos-latest' }}
      shards: 5
      package: ${{ inputs.package }}
