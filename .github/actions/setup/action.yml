name: setup
description: Bun, the workspace install, a git identity and the execution host's native library
inputs:
  native:
    description: build packages/execution-host/native, which integration and system tests boot
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bun install --frozen-lockfile
    - shell: bash
      run: |
        git config --global user.name runlith-ci
        git config --global user.email ci@runlith.invalid
        git config --global init.defaultBranch main
    - if: inputs.native == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: '. -> packages/execution-host/native/target'
    - if: inputs.native == 'true'
      shell: bash
      run: bun run --cwd packages/execution-host build:native
