<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      %sveltekit.env.PUBLIC_HOST_MODULES%
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#040404" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tagma" />
    <title>Tagma</title>
    <script>
      {
        let paint = null;
        try {
          paint = JSON.parse(localStorage.getItem('appearance.paint') ?? 'null');
        } catch {}
        const variants = paint?.variants ?? {};
        const looks = Object.keys(variants);
        const choice = paint?.choice ?? 'system';
        const wanted = choice === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : choice;
        const mode = looks.length === 1 ? looks[0] : wanted;
        document.documentElement.classList.toggle('dark', mode === 'dark');
        document.documentElement.style.colorScheme = mode;
        const shown = variants[mode];
        if (shown) {
          if (shown.declarations) {
            const style = document.createElement('style');
            style.id = 'appearance-boot';
            style.textContent = `:root:root{${shown.declarations}}`;
            document.head.append(style);
          }
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.remove();
          const meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = shown.chrome;
          document.head.append(meta);
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
